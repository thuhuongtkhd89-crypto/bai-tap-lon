<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Quản Lý Khách Sạn</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
            max-width: 440px;
            width: 100%;
            padding: 35px;
        }
        .demo-box {
            border: 2px dashed #0284c7;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f0f9ff;
        }
        .demo-box:hover {
            background: #e0f2fe;
            transform: translateX(4px);
        }
    </style>
</head>
<body class="p-3">

<div class="login-card">
    <div class="text-center mb-4">
        <div class="fs-1 text-primary mb-2"><i class="fa-solid fa-hotel"></i></div>
        <h3 class="fw-bold text-dark m-0">HOTEL MANAGEMENT</h3>
        <p class="text-muted small mt-1">Đăng nhập vào hệ thống khách sạn</p>
    </div>

    <form id="formLogin" onsubmit="handleLogin(event)" class="mb-4">
        <div class="mb-3">
            <label class="form-label fw-bold small text-secondary">Tên đăng nhập</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                <input type="text" id="username" class="form-control" placeholder="admin hoặc tên đăng nhập" required autofocus>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold small text-secondary">Mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">
            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Đăng Nhập
        </button>
    </form>

    <div class="small text-muted mb-2 fw-semibold">Tài khoản demo (Bấm nút để đăng nhập nhanh):</div>
    
    <div class="demo-box d-flex justify-content-between align-items-center" onclick="quickLogin('admin', 'admin123')">
        <div>
            <div class="fw-bold text-dark small"><i class="fa-solid fa-user-shield text-primary me-1"></i> Quản trị / Lễ tân (Admin)</div>
            <div class="text-muted" style="font-size: 0.75rem;">admin / admin123</div>
        </div>
        <span class="btn btn-sm btn-primary py-1 px-2 fw-bold" style="font-size: 0.8rem;">Vào ngay</span>
    </div>

    <div class="demo-box d-flex justify-content-between align-items-center" onclick="quickLogin('khach', 'khach123')">
        <div>
            <div class="fw-bold text-dark small"><i class="fa-solid fa-user text-success me-1"></i> Khách hàng (Demo)</div>
            <div class="text-muted" style="font-size: 0.75rem;">khach / khach123</div>
        </div>
        <span class="btn btn-sm btn-success py-1 px-2 fw-bold" style="font-size: 0.8rem;">Vào ngay</span>
    </div>

    <div class="text-center mt-4">
        <a href="booking.html" class="small text-decoration-none text-secondary">
            <i class="fa-solid fa-globe me-1"></i>Xem trang đặt phòng khách hàng
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
async function handleLogin(e) {
    if (e) e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Sai tên đăng nhập hoặc mật khẩu');

        localStorage.setItem('hotel_user', JSON.stringify(data.user));
        localStorage.setItem('hotel_token', data.access_token);

        if (data.user.role === 'admin' || data.user.role === 'staff') {
            window.location.href = 'index.html';
        } else {
            window.location.href = 'booking.html';
        }
    } catch (err) {
        Swal.fire('Lỗi đăng nhập', err.message, 'error');
    }
}

function quickLogin(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
    handleLogin();
}
</script>

</body>
</html>
